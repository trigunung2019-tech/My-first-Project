[project]
name = "agentic-ai"
version = "0.1.0"
description = "Tim agen AI perusahaan berbasis Claude: koordinator + agen per departemen"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.12", "pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-ai = "agentic_ai.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_ai"]
